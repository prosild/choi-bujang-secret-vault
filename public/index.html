<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYTE BACK | 내 자료실</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
  main { max-width: 760px; margin: 0 auto; padding: 44px 22px; }
  p { line-height: 1.7; color: #bfd0e5; }
  ul { padding: 0; list-style: none; display: grid; gap: 12px; }
  li { border: 1px solid #51667c; border-radius: 12px; padding: 16px; background: #1a2a3d; }
  strong { display: block; margin-bottom: 6px; }
  li span { color: #bfd0e5; }
  form { display: grid; gap: 10px; max-width: 360px; margin-bottom: 16px; }
  input, button { font: inherit; padding: 10px; border-radius: 6px; }
  button { cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>내 자료실</h1>
  <section aria-labelledby="auth-title">
    <h2 id="auth-title">로그인</h2>
    <p id="auth-status" role="status">로그인 상태를 확인하는 중입니다.</p>
    <form id="login-form" hidden>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">로그인</button>
    </form>
    <button id="logout" type="button" hidden>로그아웃</button>
    <p id="auth-error" role="alert"></p>
  </section>
  <p>2단계: 서버 함수가 학습용 데이터베이스에서 가상 메모를 불러옵니다. 이 API 주소는 아직 비로그인으로 열립니다.</p>
  <ul id="notes" aria-live="polite"><li>메모를 불러오는 중입니다.</li></ul>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script type="module">
  const form = document.querySelector('#login-form');
  const logout = document.querySelector('#logout');
  const status = document.querySelector('#auth-status');
  const errorMessage = document.querySelector('#auth-error');
  const password = document.querySelector('#password');
  if (!window.supabase) {
    status.textContent = '로그인 서비스를 불러오지 못했습니다. 네트워크 연결을 확인해 주세요.';
  } else {
    const client = window.supabase.createClient(
      'https://ocacvvmryvtqajlmosqj.supabase.co',
      'sb_publishable_QdAl9tMSE8PtVL5YhFjzmw_IUtYENXz'
    );
    const showSession = session => {
      form.hidden = Boolean(session);
      logout.hidden = !session;
      status.textContent = session ? '로그인되어 있습니다.' : '로그인되어 있지 않습니다.';
    };
    client.auth.onAuthStateChange((_event, session) => showSession(session));
    form.addEventListener('submit', async event => {
      event.preventDefault();
      errorMessage.textContent = '';
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        const { error } = await client.auth.signInWithPassword({
          email: document.querySelector('#email').value.trim(),
          password: password.value,
        });
        if (error) errorMessage.textContent = `로그인 실패: ${error.message}`;
      } catch {
        errorMessage.textContent = '로그인 요청에 실패했습니다. 네트워크 연결을 확인해 주세요.';
      } finally {
        password.value = '';
        button.disabled = false;
      }
    });
    logout.addEventListener('click', async () => {
      errorMessage.textContent = '';
      logout.disabled = true;
      try {
        const { error } = await client.auth.signOut();
        if (error) errorMessage.textContent = `로그아웃 실패: ${error.message}`;
      } catch {
        errorMessage.textContent = '로그아웃 요청에 실패했습니다. 네트워크 연결을 확인해 주세요.';
      } finally {
        logout.disabled = false;
      }
    });
  }
  const list = document.querySelector('#notes');
  try {
    const response = await fetch('/api/notes', { cache: 'no-store' });
    if (!response.ok) throw new Error('메모를 불러올 수 없습니다.');
    const payload = await response.json();
    if (!Array.isArray(payload.notes)) throw new Error('메모 응답 형식이 올바르지 않습니다.');
    list.replaceChildren(...payload.notes.map(note => {
      const li = document.createElement('li');
      const title = document.createElement('strong');
      const body = document.createElement('span');
      title.textContent = note.title;
      body.textContent = note.content;
      li.append(title, body);
      return li;
    }));
    if (payload.notes.length === 0) list.textContent = '등록된 가상 메모가 없습니다.';
  } catch {
    list.textContent = '메모를 불러올 수 없습니다.';
  }
</script>
</body>
</html>
