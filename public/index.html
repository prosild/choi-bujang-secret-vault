<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYTE BACK | 내 자료실</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
  main { max-width: 760px; margin: 0 auto; padding: 44px 22px; }
  p { line-height: 1.7; color: #bfd0e5; }
  ul { padding: 0; list-style: none; display: grid; gap: 12px; }
  li { border: 1px solid #51667c; border-radius: 12px; padding: 16px; background: #1a2a3d; }
  strong { display: block; margin-bottom: 6px; }
  li span { color: #bfd0e5; }
  .auth-panel { border: 1px solid #51667c; border-radius: 12px; padding: 18px; background: #1a2a3d; }
  .auth-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .auth-header h2 { margin: 0; font-size: 1.1rem; }
  #auth-status { margin: 4px 0 0; }
  #auth-error:empty { display: none; }
  form { display: grid; gap: 10px; max-width: 360px; margin-bottom: 16px; }
  form[hidden] { display: none; }
  #login-form:not([hidden]) { margin-top: 16px; }
  input, button { font: inherit; padding: 10px; border-radius: 6px; }
  textarea { font: inherit; padding: 10px; border-radius: 6px; resize: vertical; }
  .note-actions { display: flex; gap: 8px; margin-top: 12px; }
  button { cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>내 자료실</h1>
  <section class="auth-panel" aria-labelledby="auth-title">
    <div class="auth-header">
      <div>
        <h2 id="auth-title">계정</h2>
        <p id="auth-status" role="status">로그인 상태를 확인하는 중입니다.</p>
      </div>
      <button id="logout" type="button" hidden>로그아웃</button>
    </div>
    <form id="login-form" hidden>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">로그인</button>
    </form>
    <p id="auth-error" role="alert"></p>
  </section>
  <p>로그인하면 학습용 가상 메모를 볼 수 있습니다.</p>
  <form id="note-form" hidden>
    <h2 id="note-form-title">메모 추가</h2>
    <label for="note-title">제목</label>
    <input id="note-title" maxlength="200" required>
    <label for="note-body">내용</label>
    <textarea id="note-body" maxlength="10000" rows="4" required></textarea>
    <div class="note-actions"><button type="submit">저장</button><button id="cancel-edit" type="button" hidden>수정 취소</button></div>
  </form>
  <p id="note-message" role="status"></p>
  <ul id="notes" aria-live="polite"><li>로그인 상태를 확인하는 중입니다.</li></ul>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script type="module">
  const form = document.querySelector('#login-form');
  const logout = document.querySelector('#logout');
  const status = document.querySelector('#auth-status');
  const errorMessage = document.querySelector('#auth-error');
  const password = document.querySelector('#password');
  const list = document.querySelector('#notes');
  const noteForm = document.querySelector('#note-form');
  const noteTitle = document.querySelector('#note-title');
  const noteBody = document.querySelector('#note-body');
  const noteMessage = document.querySelector('#note-message');
  const cancelEdit = document.querySelector('#cancel-edit');
  let sessionNow = null;
  let editingId = null;
  let requestVersion = 0;
  function resetEditor() {
    editingId = null;
    noteForm.reset();
    document.querySelector('#note-form-title').textContent = '메모 추가';
    cancelEdit.hidden = true;
  }
  async function noteRequest(path, options = {}, session = sessionNow) {
    if (!session) throw new Error('로그인이 필요합니다.');
    const response = await fetch(path, { ...options, cache: 'no-store', headers: {
      Authorization: `Bearer ${session.access_token}`, ...options.headers,
    } });
    if (!response.ok) throw new Error('메모 요청에 실패했습니다. 다시 시도해 주세요.');
    return response.json();
  }
  async function loadNotes(session) {
    const version = ++requestVersion;
    list.textContent = session ? '메모를 불러오는 중입니다.' : '로그인하면 메모를 볼 수 있습니다.';
    if (!session) return;
    try {
      const payload = await noteRequest('/api/notes', {}, session);
      if (!Array.isArray(payload.notes)) throw new Error('메모 응답 형식이 올바르지 않습니다.');
      if (version !== requestVersion) return;
      list.replaceChildren(...payload.notes.map(note => {
        const li = document.createElement('li');
        const title = document.createElement('strong');
        const body = document.createElement('span');
        title.textContent = note.title;
        body.textContent = note.body;
        const actions = document.createElement('div');
        actions.className = 'note-actions';
        const edit = document.createElement('button');
        edit.type = 'button'; edit.textContent = '수정';
        edit.addEventListener('click', () => {
          editingId = note.id; noteTitle.value = note.title; noteBody.value = note.body;
          document.querySelector('#note-form-title').textContent = '메모 수정';
          cancelEdit.hidden = false; noteMessage.textContent = ''; noteTitle.focus();
        });
        const remove = document.createElement('button');
        remove.type = 'button'; remove.textContent = '삭제';
        remove.addEventListener('click', async () => {
          if (!window.confirm('이 메모를 삭제할까요?')) return;
          remove.disabled = true;
          const current = sessionNow;
          try {
            await noteRequest(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' }, current);
            if (current !== sessionNow) return;
            if (editingId === note.id) resetEditor();
            noteMessage.textContent = '메모를 삭제했습니다.';
            await loadNotes(current);
          } catch { if (current === sessionNow) noteMessage.textContent = '메모를 삭제하지 못했습니다.'; }
          finally { remove.disabled = false; }
        });
        actions.append(edit, remove);
        li.append(title, body, actions);
        return li;
      }));
      if (payload.notes.length === 0) list.textContent = '등록된 가상 메모가 없습니다.';
    } catch {
      if (version === requestVersion) list.textContent = '메모를 불러올 수 없습니다.';
    }
  }
  if (!window.supabase) {
    status.textContent = '로그인 서비스를 불러오지 못했습니다. 네트워크 연결을 확인해 주세요.';
    list.textContent = '로그인 서비스를 불러오지 못해 메모를 표시할 수 없습니다.';
  } else {
    const client = window.supabase.createClient(
      'https://ocacvvmryvtqajlmosqj.supabase.co',
      'sb_publishable_QdAl9tMSE8PtVL5YhFjzmw_IUtYENXz'
    );
    const showSession = session => {
      form.hidden = Boolean(session);
      logout.hidden = !session;
      status.textContent = session ? '로그인되어 있습니다.' : '로그인되어 있지 않습니다.';
    };
    client.auth.onAuthStateChange((_event, session) => {
      const previousUser = sessionNow?.user?.id;
      sessionNow = session;
      noteForm.hidden = !session;
      if (!session || previousUser !== session.user?.id) { resetEditor(); noteMessage.textContent = ''; }
      showSession(session);
      void loadNotes(session);
    });
    cancelEdit.addEventListener('click', resetEditor);
    noteForm.addEventListener('submit', async event => {
      event.preventDefault();
      const current = sessionNow;
      const id = editingId;
      const button = noteForm.querySelector('button[type="submit"]');
      button.disabled = true; noteMessage.textContent = '';
      try {
        await noteRequest(id ? `/api/notes/${encodeURIComponent(id)}` : '/api/notes', {
          method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: noteTitle.value, body: noteBody.value }),
        }, current);
        if (current !== sessionNow) return;
        resetEditor(); noteMessage.textContent = id ? '메모를 수정했습니다.' : '메모를 추가했습니다.';
        await loadNotes(current);
      } catch { if (current === sessionNow) noteMessage.textContent = '메모를 저장하지 못했습니다.'; }
      finally { button.disabled = false; }
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      errorMessage.textContent = '';
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        const { error } = await client.auth.signInWithPassword({
          email: document.querySelector('#email').value.trim(),
          password: password.value,
        });
        if (error) errorMessage.textContent = `로그인 실패: ${error.message}`;
      } catch {
        errorMessage.textContent = '로그인 요청에 실패했습니다. 네트워크 연결을 확인해 주세요.';
      } finally {
        password.value = '';
        button.disabled = false;
      }
    });
    logout.addEventListener('click', async () => {
      errorMessage.textContent = '';
      logout.disabled = true;
      try {
        const { error } = await client.auth.signOut();
        if (error) errorMessage.textContent = `로그아웃 실패: ${error.message}`;
      } catch {
        errorMessage.textContent = '로그아웃 요청에 실패했습니다. 네트워크 연결을 확인해 주세요.';
      } finally {
        logout.disabled = false;
      }
    });
  }
</script>
</body>
</html>
